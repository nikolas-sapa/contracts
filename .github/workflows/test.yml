name: test

on:
  push:
  pull_request:
    branches: [main]

jobs:
  clarinet-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin npm major so npm ci does not depend on the runner image
        run: npm install -g npm@11

      - run: npm ci
      - run: npm test

      - name: Coverage report
        run: npm run test:report

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            costs-reports.json
          retention-days: 7
